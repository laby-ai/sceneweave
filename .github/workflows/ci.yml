name: CI

on:
  pull_request:
  push:
    branches:
      - codex/sync-huiying-prod-20260629

permissions:
  contents: read

concurrency:
  group: sceneweave-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_PUBLIC_BASE_PATH: /huiying
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Activate locked pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify CI contract
        run: pnpm run test:ci-workflow

      - name: Check architecture ownership and growth
        run: |
          pnpm run qa:architecture-guard
          pnpm run qa:spaghetti-growth-guard

      - name: Check TypeScript
        run: pnpm run ts-check

      - name: Check account and member isolation
        run: |
          pnpm run test:cross-app-auth-contract
          pnpm run test:client-request-contract
          pnpm run test:loopback-listener-contract
          pnpm run test:request-observability
          pnpm run test:secure-task-observability
          pnpm run test:service-metrics
          pnpm run test:long-task-admission
          pnpm run test:member-subject-library
          pnpm run test:member-final-video-store
          pnpm run test:member-task-isolation
          pnpm run test:member-bailian-profile
          pnpm run test:provider-independence

      - name: Check mobile Film contracts
        run: |
          pnpm run test:film-mobile-workspace
          pnpm run test:film-mobile-viewport

      - name: Check Vimax boundary
        run: |
          pnpm run test:creation-agent-layout
          pnpm run test:vimax-authenticated-transport
          pnpm run test:vimax-qwen37-planning-payload
          pnpm run test:vimax-reference-request-timeout
          pnpm run test:vimax-task-project-recovery
          pnpm run test:vimax-video-input-assets
          pnpm run test:vimax-split-media-connection
          pnpm run qa:segment-tail-recovery-service
          pnpm run test:ffmpeg-runtime-resolution
          pnpm run qa:smart-vimax-agent-render

      - name: Check compose durability
        run: |
          pnpm run test:film-compose-client
          pnpm run test:film-compose-durability

      - name: Check production media and release contracts
        run: |
          pnpm run test:film-media-preview
          pnpm run test:media-library-preview-fastpath
          pnpm run test:home-gallery-freshness
          pnpm run test:release-promotion-contract
          bash -n deploy/linux/promote-release.sh

      - name: Build production artifacts
        run: |
          pnpm next build
          pnpm tsup src/server.ts --format cjs --platform node --target node20 --outDir dist --no-splitting --no-minify

      - name: Check real browser user journey
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run qa:creation-agent-user-journey
